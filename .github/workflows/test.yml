name: test

on:
  pull_request:
  push:
    branches: [hosted-server]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: NaturalCycles/ci-typescript/actions/setup-node-pnpm@v2
      # Typecheck resolves workspace imports through built dists, so the build comes first.
      - run: pnpm build
      - run: pnpm test
