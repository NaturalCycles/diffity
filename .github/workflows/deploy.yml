name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: nc-innovation-496314
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/nc-innovation-496314/diffity/diffity

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:5390:5390 ${{ env.IMAGE }}:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5390/healthz; then
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # rebuilt rather than carried over from `build`: the layers are all in the buildx gha cache,
      # so this is a cache hit and only the push costs anything
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        env:
          GITHUB_APP_CLIENT_ID: ${{ vars.DIFFITY_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_SLUG: ${{ vars.DIFFITY_GITHUB_APP_SLUG }}
          # /projects/<project number>/global/backendServices/<id of the `diffity` backend service>
          IAP_AUDIENCE: ${{ vars.DIFFITY_IAP_AUDIENCE }}
        run: |
          if [ -z "$IAP_AUDIENCE" ]; then
            echo "Set the DIFFITY_IAP_AUDIENCE repository variable" >&2
            exit 1
          fi
          env_vars="DIFFITY_PUBLIC_URL=https://diffity.prod.naturalcycles.net"
          env_vars+=",DIFFITY_TRUST_PROXY=1"
          env_vars+=",DIFFITY_IAP_AUDIENCE=${IAP_AUDIENCE}"
          secrets="DATABASE_URL=diffity-database-url:latest,DIFFITY_PG_CA=diffity-postgres-ca:latest,DIFFITY_SECRET_KEY=diffity-secret-key:latest"
          # Without the App, users paste a GitHub token on Settings instead.
          if [ -n "$GITHUB_APP_CLIENT_ID" ]; then
            env_vars+=",DIFFITY_GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}"
            secrets+=",DIFFITY_GITHUB_APP_CLIENT_SECRET=diffity-github-app-client-secret:latest"
          fi
          if [ -n "$GITHUB_APP_SLUG" ]; then
            env_vars+=",DIFFITY_GITHUB_APP_SLUG=${GITHUB_APP_SLUG}"
          fi

          gcloud run deploy diffity \
            --project "$PROJECT" \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region "$REGION" \
            --service-account diffity-runtime@nc-innovation-496314.iam.gserviceaccount.com \
            --vpc-connector diffity-vpc-connector \
            --vpc-egress private-ranges-only \
            --allow-unauthenticated \
            --ingress internal-and-cloud-load-balancing \
            --no-default-url \
            --execution-environment gen2 \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 1 \
            --set-env-vars "$env_vars" \
            --set-secrets "$secrets"

      # A plain API call: this repository is public, and actions in the org's private
      # ci-typescript repository cannot be used from a public one.
      - name: announce deploy outcome in Slack
        if: always() && env.SLACK_API_TOKEN != ''
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          OUTCOME: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = success ]; then text="diffity deployed to Cloud Run"; else text="diffity deployment failed: $RUN_URL"; fi
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_API_TOKEN" -H 'Content-Type: application/json; charset=utf-8' \
            -d "$(printf '{"channel":"%s","text":"%s"}' "${{ vars.DIFFITY_SLACK_CHANNEL || '#deployments' }}" "$text")" > /dev/null
